<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        let theme = 'dark'
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          theme === 'light' ? '#F3EFE5' : '#000000',
        )
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
    <meta name="description" content="Personal portfolio of Hisham Abdulla, showcasing software development projects, technical skills, learning, writing and interests." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hisham Abdulla — Full-Stack Developer" />
    <meta property="og:description" content="Personal portfolio of Hisham Abdulla, showcasing software development projects, technical skills, learning, writing and interests." />

    <meta name="twitter:title" content="Hisham Abdulla — Full-Stack Developer" />
    <meta name="twitter:description" content="Personal portfolio of Hisham Abdulla, showcasing software development projects, technical skills, learning, writing and interests." />
    <title>Hisham Abdulla — Full-Stack Developer</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
